active_dataset: simGPT

datasets:
  PPMI:
    col_str_name: LEDTRT_
    subid: PATNO
    file: PPMI/simulated/LEDD_Concomitant_Medication_Log_simulated.csv
    cols: [LEDTRT_simulated, LEDD]

  PPMI_archived:
    col_str_name: CMTRT_
    subid: PATNO
    file: PPMI_archived/simulated/Concomitant_Medications-Archived_05Jun2026_simulated_edited_part1.csv
    cols: [PATNO, REC_ID, CMTRT_simulated, CMDOSE, CMDOSU, LEDD]

  ADNI:
    col_str_name: CMMED_
    subid: PTID
    file: ADNI/simulated/RECCMEDS_25Mar2026_simulated.csv
    cols: [CMMED_simulated]

  simGPT:
    col_str_name: rx_note_
    subid: ""
    file: simGPT/simulated/simGPT.csv
    cols: [rx_note_simulated]

  eicu:
    col_str_name: drugname_
    subid: patientunitstayid
    raw_med_col_override: drugname   # when raw_med_col != col_str_name + simulated
    file: null                        # loaded from TEMP_DIR, handled separately
    cols: [drugname]